name: Publish npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release tag and branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const p = require('./package.json'); if (process.env.RELEASE_TAG !== 'v' + p.version || !/^\d+\.\d+\.\d+$/.test(p.version)) throw new Error('Use a stable v<package.json version> tag');"
          git merge-base --is-ancestor HEAD origin/main
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - name: Publish with npm trusted publishing
        run: npm publish --access public --provenance
